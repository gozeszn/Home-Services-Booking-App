services:
  - type: web
    name: Home-Services-Booking-App
    runtime: node
    plan: free
    region: frankfurt

    buildFilter:
      ignoredPaths:
        - frontend/**

    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGO_URI
        sync: false

      - key: CLIENT_URL
        sync: false

      
